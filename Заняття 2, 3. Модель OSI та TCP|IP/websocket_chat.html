<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSocket Chat</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  #log { height: 50vh; overflow-y: auto; border: 1px solid #ccc; padding: 8px; font-family: monospace; }
  form { display: flex; gap: 8px; margin-top: 8px; }
  input { flex: 1; padding: 8px; }
</style>
</head>
<body>
  <h1>WebSocket chat</h1>
  <p>Open DevTools → Network → WS → Messages to see the frames.</p>
  <div id="log"></div>
  <form id="form"><input id="text" autofocus autocomplete="off"><button>Send</button></form>
<script>
  const ws = new WebSocket(`ws://${location.host}/`);
  const log = document.getElementById("log");
  const input = document.getElementById("text");

  ws.onmessage = (event) => {
    log.append(event.data, document.createElement("br"));
    log.scrollTop = log.scrollHeight;
  };
  document.getElementById("form").onsubmit = (event) => {
    event.preventDefault();
    if (input.value) ws.send(input.value);
    input.value = "";
  };
</script>
</body>
</html>
